<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лекция 1: Данные и методы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#10222F; --ink-2:#3A4C58; --mute:#6C7A83;
  --paper:#F0F1EC; --card:#FAFAF7; --rule:#CDD2CB;
  --blue:#0072B2; --amber:#D55E00; --teal:#009E73; --plum:#8C5A9E;
  --grid:#DDE1DA;
  --shadow:0 1px 0 rgba(16,34,47,.05), 0 12px 34px -22px rgba(16,34,47,.5);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rail:74px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E7ECEE; --ink-2:#B5C2C9; --mute:#8798A2;
    --paper:#0C1720; --card:#132430; --rule:#263A47;
    --blue:#4FA8DC; --amber:#F0813C; --teal:#2FBF9A; --plum:#B98CCB;
    --grid:#1E3140;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 40px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ink:#E7ECEE; --ink-2:#B5C2C9; --mute:#8798A2;
  --paper:#0C1720; --card:#132430; --rule:#263A47;
  --blue:#4FA8DC; --amber:#F0813C; --teal:#2FBF9A; --plum:#B98CCB;
  --grid:#1E3140;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 40px -24px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.deck{scroll-snap-type:y mandatory; height:100svh; overflow-y:auto; scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.deck{scroll-behavior:auto}}

.slide{
  scroll-snap-align:start; scroll-snap-stop:always;
  min-height:100svh; display:flex; flex-direction:column; justify-content:center;
  padding:44px calc(var(--rail) + 26px) 48px 26px; position:relative; overflow:hidden;
  border-bottom:1px solid var(--rule);
}
.slide > .inner{width:100%; max-width:1080px; margin:0 auto; max-height:100%;
  overflow-y:auto; overflow-x:hidden; scrollbar-width:thin}
.slide > .inner::-webkit-scrollbar{width:6px}
.slide > .inner::-webkit-scrollbar-thumb{background:var(--rule); border-radius:3px}
@media (max-width:760px){
  :root{--rail:0px}
  .slide{padding:44px 20px 56px; min-height:auto}
  body{font-size:16px}
}

/* ---- ledger rail ---- */
.rail{
  position:fixed; top:0; right:0; width:var(--rail); height:100svh;
  border-left:1px solid var(--rule); background:var(--paper);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:18px 0; z-index:20; font-family:var(--f-mono); font-size:11px; color:var(--mute);
}
@media (max-width:760px){.rail{display:none}}
.rail .num{font-size:15px; color:var(--ink); font-weight:500}
.rail .sect{writing-mode:vertical-rl; letter-spacing:.16em; text-transform:uppercase; font-size:10px}
.rail button{
  font:inherit; color:var(--mute); background:none; border:1px solid var(--rule);
  border-radius:3px; width:34px; height:26px; cursor:pointer;
}
.rail button:hover{color:var(--ink); border-color:var(--ink-2)}
.rail button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.progress{position:fixed; top:0; left:0; height:2px; background:var(--amber); z-index:30; width:0}

/* ---- type ---- */
.eyebrow{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--amber); margin-bottom:14px; display:flex; gap:10px; align-items:center;
}
.eyebrow::before{content:""; width:18px; height:1px; background:currentColor; flex:none}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(30px,4.6vw,54px); line-height:1.04;
   letter-spacing:-.02em; margin:0 0 18px; text-wrap:balance}
h2{font-family:var(--f-display); font-weight:700; font-size:clamp(22px,2.7vw,34px); line-height:1.12;
   letter-spacing:-.015em; margin:0 0 12px; text-wrap:balance}
.lead{font-size:clamp(15.5px,1.25vw,18.5px); line-height:1.45; color:var(--ink-2); max-width:70ch;
      margin:0 0 22px; font-weight:500}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

/* ---- point list ---- */
.points{display:grid; gap:1px; margin-top:4px; background:var(--rule); border-top:1px solid var(--rule);
        border-bottom:1px solid var(--rule)}
.points.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:860px){.points.two{grid-template-columns:1fr}}
.pt{background:var(--paper); padding:12px 16px; display:grid; grid-template-columns:auto 1fr; gap:14px}
.pt .lab{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
         color:var(--mute); padding-top:4px; white-space:nowrap}
.pt p{margin:0; font-size:14.5px; line-height:1.45}
.pt.solo{grid-template-columns:1fr}

/* ---- aside / callout ---- */
.aside{border-left:3px solid var(--amber); padding:10px 0 10px 14px; margin-top:18px;
       color:var(--ink-2); font-size:14.5px; max-width:74ch}
.aside b{color:var(--ink)}

/* ---- figure ---- */
figure{margin:0}
figure svg{display:block; width:100%; height:auto; max-height:48svh; overflow:visible}
figcaption{font-size:13.5px; color:var(--mute); margin-top:12px; max-width:78ch; line-height:1.5}
.fig-wrap{overflow-x:auto}

/* ---- title slide ---- */
.title-slide{justify-content:center}
.tmeta{font-family:var(--f-mono); font-size:13px; color:var(--mute); line-height:2}
.tmeta b{color:var(--ink); font-weight:500}
.toc{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
     background:var(--rule); border:1px solid var(--rule); margin-top:38px}
.toc a{background:var(--paper); padding:12px 14px; text-decoration:none; color:var(--ink-2);
       font-size:13.5px; display:block}
.toc a:hover{background:var(--card); color:var(--ink)}
.toc a:focus-visible{outline:2px solid var(--blue); outline-offset:-2px}
.toc .k{font-family:var(--f-mono); font-size:10px; color:var(--mute); display:block; margin-bottom:3px}

/* ---- divider slide ---- */
.divider{background:var(--ink); color:var(--paper)}
.divider h1{color:var(--paper)}
.divider .lead{color:rgba(255,255,255,.72)}
:root[data-theme="dark"] .divider, :root:not([data-theme="light"]) .divider{background:var(--card)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .divider{background:var(--ink)}}
.divider .eyebrow{color:var(--amber)}

/* ---- quote ---- */
/* обе реплики — один объект, отличаются только тем, кто говорит */
.talk{display:flex; flex-direction:column; gap:12px; max-width:64ch}
.talk .msg{border-left:3px solid var(--rule); padding:14px 18px; background:var(--card);
           font-size:16.5px; line-height:1.5}
.talk .msg .who{display:block; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em;
                text-transform:uppercase; color:var(--mute); margin-bottom:7px}
.talk .msg.answer{border-left-color:var(--amber)}
.talk .msg.answer b{color:var(--amber)}

/* ---- data table ---- */
table{border-collapse:collapse; font-family:var(--f-mono); font-size:14px; font-variant-numeric:tabular-nums}
th,td{padding:7px 14px 7px 0; text-align:right; border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); font-weight:500}
tr.hi td{color:var(--amber)}
tr.ok td{color:var(--teal)}

.cols{display:grid; grid-template-columns:1.05fr .95fr; gap:34px; align-items:center}
@media (max-width:900px){.cols{grid-template-columns:1fr; gap:24px}}
.stack{display:flex; flex-direction:column; gap:20px}
.hint{position:fixed; bottom:14px; left:20px; font-family:var(--f-mono); font-size:11px;
      color:var(--mute); z-index:20; opacity:.75}
@media (max-width:760px){.hint{display:none}}
</style>

<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

  <div style="display:flex;flex-direction:column;gap:6px">

</div>

<div class="deck" id="deck"></div>
<div style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" id="svgdefs">
<!-- ===== FIG: модель как функция ===== -->
<svg id="svg-model" viewBox="0 0 660 220" role="img" aria-label="Признаки входят в функцию f, из неё выходит прогноз; шум эпсилон добавляется отдельно и остаётся всегда">

  </g>
</svg>

      <text x="572" y="95" font-size="11" fill="#D55E00" opacity=".85">в банке почти невозможен</text>
      <rect x="744" y="52" width="150" height="58" fill="none" stroke="currentColor" stroke-width="1.6"/>

  </g>
</svg>

const NS="http://www.w3.org/2000/svg";
function S(t,a={},k=[]){const n=document.createElementNS(NS,t);
  for(const p in a) if(a[p]!==null&&a[p]!==undefined) n.setAttribute(p,a[p]);
  (Array.isArray(k)?k:[k]).forEach(c=>n.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return n;}
function box(w,h,lab){return S("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":lab,
  "font-family":"JetBrains Mono, monospace"});}
const C=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const T=(x,y,s,o={})=>S("text",Object.assign({x,y,"font-size":11,fill:C("--mute")},o),s);

/* M1 — рассеяние с остатками */
function fig_scatter_residuals(D){
  const W=900,H=330,PW=760,PH=228,X0=76,Y0=44,d=D.nco;
  const s=box(W,H,"Списания против рентабельности: линия модели и вертикальные остатки");
  const [xl,xh]=d.xlim, yl=-0.055, yh=0.035;
  const sx=v=>X0+(v-xl)/(xh-xl)*PW, sy=v=>Y0+(yh-v)/(yh-yl)*PH;
  [-0.04,-0.02,0,0.02].forEach(v=>{s.appendChild(S("line",{x1:X0,x2:X0+PW,y1:sy(v),y2:sy(v),
    stroke:C("--grid"),"stroke-width":1}));s.appendChild(T(X0-10,sy(v)+4,(v*100).toFixed(0)+"%",
    {"text-anchor":"end"}));});
  const f=v=>d.icept+d.slope*v;
  d.pts.forEach(([a,b])=>{if(a<xl||a>xh)return;
    s.appendChild(S("line",{x1:sx(a),x2:sx(a),y1:sy(b),y2:sy(f(a)),stroke:C("--amber"),
      "stroke-width":1.2,opacity:.5}));});
  d.pts.forEach(([a,b])=>{if(a>=xl&&a<=xh)
    s.appendChild(S("circle",{cx:sx(a),cy:sy(b),r:3.2,fill:C("--amber"),opacity:.85}));});
  s.appendChild(S("line",{x1:sx(xl),y1:sy(f(xl)),x2:sx(xh),y2:sy(f(xh)),stroke:C("--blue"),
    "stroke-width":3.6,"stroke-linecap":"round"}));
  s.appendChild(T(X0,26,"ROA, годовых · по горизонтали — доля списанных кредитов"));
  s.appendChild(T(X0+PW,Y0+PH+24,"R² = 0.309",{"text-anchor":"end","font-size":15,
    fill:C("--blue"),"font-weight":500}));
  s.appendChild(T(X0,Y0+PH+24,"каждый оранжевый отрезок — то, чего модель не знает"));
  return s;}

/* M2 — три облака + призрачный столбец */
function fig_three_scatters(D){
  const PAN=[["nco","Списания / кредиты"],["cost","Расходы / доход"],["nim","Процентная маржа"]];
  const W=1000,H=390,PW=286,PH=176,GAP=32,X0=54,Y0=48;
  const s=box(W,H,"Три парных связи и то, что их R² не складываются");
  const yl=-0.055,yh=0.035;
  PAN.forEach(([k,t],i)=>{const d=D[k],ox=X0+i*(PW+GAP),[xl,xh]=d.xlim;
    const sx=v=>ox+(v-xl)/(xh-xl)*PW, sy=v=>Y0+(yh-v)/(yh-yl)*PH;
    [-0.04,-0.02,0,0.02].forEach(v=>{s.appendChild(S("line",{x1:ox,x2:ox+PW,y1:sy(v),y2:sy(v),
      stroke:C("--grid"),"stroke-width":1}));
      if(i===0) s.appendChild(T(ox-8,sy(v)+4,(v*100).toFixed(0)+"%",{"text-anchor":"end"}));});
    d.pts.forEach(([a,b])=>s.appendChild(S("circle",{cx:sx(a),cy:sy(b),r:2.4,fill:C("--amber"),
      opacity:.4})));
    s.appendChild(S("line",{x1:sx(xl),y1:sy(d.icept+d.slope*xl),x2:sx(xh),y2:sy(d.icept+d.slope*xh),
      stroke:C("--blue"),"stroke-width":3.2,"stroke-linecap":"round"}));
    s.appendChild(T(ox,Y0-12,t,{"font-size":12.5,fill:C("--ink"),"font-weight":500}));
    s.appendChild(T(ox+PW,Y0+PH+18,"R² = "+d.r2.toFixed(3),{"text-anchor":"end","font-size":12.5,
      fill:C("--blue"),"font-weight":500}));});
  // призрачный столбец
  const g=D.ghost,BY=300,BH=64,BX=X0,BW=W-X0-40;
  const bars=[["0.309",g.pairs[0],"--blue"],["0.256",g.pairs[1],"--blue"],["0.120",g.pairs[2],"--blue"],
              ["0.685",g.sum,"ghost"],["0.549",g.full,"--teal"]];
  const maxv=0.7, bw=88, gap=26;
  bars.forEach(([lab,v,col],i)=>{const x=BX+i*(bw+gap),h=v/maxv*BH;
    s.appendChild(S("rect",{x,y:BY+BH-h,width:bw,height:h,
      fill:col==="ghost"?"none":C(col),opacity:col==="ghost"?1:.85,
      stroke:col==="ghost"?C("--amber"):"none","stroke-width":1.6,
      "stroke-dasharray":col==="ghost"?"5 4":null}));
    s.appendChild(T(x+bw/2,BY+BH+16,lab,{"text-anchor":"middle","font-size":12,
      fill:col==="ghost"?C("--amber"):C("--ink"),"font-weight":500}));});
  s.appendChild(T(BX+3*(bw+gap)+bw/2,BY-8,"призрак",{"text-anchor":"middle","font-size":11,
    fill:C("--amber")}));

/* ---- общий рисователь одной поверхности ---- */
function drawSurf(svg,ox,Z,zl,zh,PW,n,yBase,kzPx,edges){
  const kx=PW/2/(n-1), ky=34/(n-1), kz=kzPx/(zh-zl);
  const cl=v=>Math.max(zl,Math.min(zh,v));
  const pr=(i,j,v)=>[ox+PW/2+(i-j)*kx, yBase+(i+j)*ky-(cl(v)-zl)*kz];
  const q=[];
  for(let j=0;j<n-1;j++)for(let i=0;i<n-1;i++){
    const c=[[i,j],[i+1,j],[i+1,j+1],[i,j+1]].map(([a,b])=>pr(a,b,Z[b][a]));
    const zm=(Z[j][i]+Z[j][i+1]+Z[j+1][i+1]+Z[j+1][i])/4;
    q.push({d:i+j,pts:c.map(e=>e.join(",")).join(" "),t:(cl(zm)-zl)/(zh-zl)});}
  q.sort((a,b)=>a.d-b.d);
  q.forEach(o=>svg.appendChild(S("polygon",{points:o.pts,
    fill:o.t>.62?C("--teal"):o.t>.34?C("--blue"):C("--amber"),
    "fill-opacity":.16+.52*o.t,stroke:C("--rule"),"stroke-width":.4})));
  if(edges!==false) [[0,"--amber"],[n-1,"--blue"]].forEach(([j,col])=>{const pts=[];
    for(let i=0;i<n;i++)pts.push(pr(i,j,Z[j][i]).join(","));
    svg.appendChild(S("polyline",{points:pts.join(" "),fill:"none",stroke:C(col),
      "stroke-width":2.8,"stroke-linecap":"round"}));});
}

    transform:"rotate(-90)"},"PC2: качество активов →"));
  const NAMES=[["кредитные","кредиты почти равны депозитам"],
               ["казначейские","треть активов в ценных бумагах"],
               ["проблемные","просрочка втрое выше, фондирование дорогое"]];
  const ord=p.groups.map(g=>g.id);
  const RX=X0+PW+48;
  p.groups.forEach((g,i)=>{
    const nm = g.sec>0.25 ? NAMES[1] : (g.npl>0.012 ? NAMES[2] : NAMES[0]);
    const y=Y0+i*84;
    s.appendChild(S("rect",{x:RX,y,width:16,height:16,fill:COL[g.id%3],opacity:.75}));
    s.appendChild(T(RX+26,y+13,`${g.n} · ${nm[0]}`,{"font-size":14,fill:C("--ink"),"font-weight":500}));
    s.appendChild(T(RX+26,y+31,nm[1],{"font-size":11.5}));
    s.appendChild(T(RX+26,y+52,`кредиты/деп ${g.ld}   бумаги ${g.sec}`,{"font-size":11.5,
      fill:C("--ink-2")}));
    s.appendChild(T(RX+26,y+68,`просрочка ${(g.npl*100).toFixed(1)}%   брокерские ${(g.bro*100).toFixed(0)}%   издержки ${g.cost}`,
      {"font-size":11.5,fill:C("--ink-2")}));});
  s.appendChild(T(RX,Y0+3*84+8,"Названия придумали мы. Метрики точности здесь нет:",{"font-size":11.5,fill:C("--amber")}));
  s.appendChild(T(RX,Y0+3*84+24,"правильного ответа не существует.",{"font-size":11.5,fill:C("--amber")}));
  return s;}

/* Карта методов: гибкость против интерпретируемости */
function fig_map(D){
  const W=700,H=380,PW=540,PH=300,X0=110,Y0=30;
  const s=box(W,H,"Карта методов: чем свободнее форма, тем труднее объяснить решение");
  const M=[["Отбор признаков, лассо",1.0,5.0,"--blue","S03"],
           ["Линейная регрессия",2.0,4.75,"--blue","S02"],
           ["Логистическая регрессия",2.5,4.3,"--teal","S04"],
           ["Аддитивные модели",3.3,3.2,"--blue","S02"],
           ["Деревья решений",3.6,3.55,"--plum","S05"],
           ["Случайный лес, бустинг",4.4,1.7,"--amber","S05"],
           ["Нейросети",4.9,1.0,"--amber","S05"]];
  const sx=v=>X0+(v-.5)/5*PW, sy=v=>Y0+(5.6-v)/5.4*PH;
  s.appendChild(S("rect",{x:X0,y:Y0,width:PW,height:PH,fill:"none",stroke:C("--rule")}));
  s.appendChild(S("line",{x1:sx(.6),y1:sy(5.5),x2:sx(5.4),y2:sy(.3),stroke:C("--rule"),
    "stroke-width":1.4,"stroke-dasharray":"5 5"}));
  M.forEach(([nm,fx,iy,col,ss])=>{
    s.appendChild(S("circle",{cx:sx(fx),cy:sy(iy),r:6,fill:C(col)}));
    s.appendChild(T(sx(fx)+11,sy(iy)+4,nm,{"font-size":12,fill:C("--ink"),
      "font-family":"Golos Text, sans-serif"}));
    s.appendChild(T(sx(fx)+11,sy(iy)+17,ss,{"font-size":9.5}));});
  s.appendChild(T(X0,Y0+PH+22,"гибкость формы →",{"font-size":11.5}));
  s.appendChild(S("text",{x:-(Y0+PH),y:16,"font-size":11.5,fill:C("--mute"),
    transform:"rotate(-90)"},"интерпретируемость →"));
  return s;}

const FIGS={fig_scatter_residuals,fig_three_scatters,fig_coef_collapse,fig_marginal,
  fig_two_surfaces,fig_param_nonparam,fig_price,fig_bias_variance,fig_pca,fig_map};

/* ---------- рендер ---------- */
const deck = document.getElementById("deck");
const defs = document.getElementById("svgdefs");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function pointsBlock(body, two){
  if(!body.length) return "";
  const rows = body.map(b => `<div class="pt${b.label?"":" solo"}">${
    b.label ? `<div class="lab">${esc(b.label)}</div>` : ""
  }<p>${b.point}</p></div>`).join("");
  return `<div class="points${two?" two":""}">${rows}</div>`;
}

SLIDES.forEach((s, i) => {
  const sec = document.createElement("section");
  sec.className = "slide" + (s.kind === "divider" ? " divider" : "") +
                  (s.kind === "title" ? " title-slide" : "");
  sec.id = s.id;
  const inner = document.createElement("div");
  inner.className = "inner";
  let html = "";
  if (s.eyebrow) html += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  html += (s.kind === "title" ? `<h1>${esc(s.title)}</h1>` : `<h2>${esc(s.title)}</h2>`);
  if (s.lead) html += `<p class="lead">${s.lead}</p>`;

  if (s.kind === "title") {
    html += `<div class="tmeta">Курс <b>«Цифровые активы в банках»</b><br>
      МГИМО · магистратура «Международный банковский бизнес» · 2026<br>
      <b>Войтов Николай</b></div>
      <div class="toc" id="toc"></div>`;
  } else if (s.kind === "fin") {
    html += pointsBlock(s.body, false);
  } else if (s.kind === "quote") {
    html += `<div class="cols"><div class="talk">
        <div class="msg"><span class="who">пост в чате</span>для построения форкаста
        использовал логистическую регрессию. для сравнения добавил линейную,
        отклонения до 1 пп</div>
        <div class="msg"><span class="who">вопрос</span>а почему расхождение именно такое?</div>
        <div class="msg answer"><span class="who">ответ</span>Нет, честный ответ хуже:
        <b>я это просто не проверял</b>.</div>
      </div><div>${pointsBlock(s.body, false)}</div></div>`;
  } else if (s.figure && s.figure.startsWith("svg-")) {
    html += `<div class="cols"><div>${pointsBlock(s.body, false)}</div>
      <figure class="fig-wrap" data-static="${s.figure}"></figure></div>`;
  } else if (s.figure) {
    html += `<figure class="fig-wrap" data-fig="${s.figure}"></figure>` +
            pointsBlock(s.body, true);
  } else {
    html += pointsBlock(s.body, s.body.length > 3);
  }
  if (s.aside) html += `<div class="aside">${s.aside}</div>`;
  inner.innerHTML = html;
  sec.appendChild(inner);
  deck.appendChild(sec);
});

/* фигуры */
document.querySelectorAll("[data-fig]").forEach(f => {
  const fn = FIGS[f.dataset.fig];
  if (fn) { try { f.appendChild(fn(DATA)); } catch (e) { f.textContent = ""; } }
});
document.querySelectorAll("[data-static]").forEach(f => {
  const src = defs.querySelector("#" + f.dataset.static);
  if (src) f.appendChild(src.cloneNode(true));
});

/* оглавление */
const toc = document.getElementById("toc");
if (toc) {
  const KEY = {passport:"Паспорт", hw0:"Домашка", concepts:"Понятия", roles:"Роли",
    lifecycle:"Цикл", methods_divider:"Методы", m5_bending:"Форма модели",
    m7_bias_variance:"Смещение и дисперсия", m9_map:"Карта методов", ai_slop:"ИИ-slop"};
  Object.entries(KEY).forEach(([id, t], i) => {

    toc.insertAdjacentHTML("beforeend",

/* навигация */
const secs = [...document.querySelectorAll(".slide")];
const SECT = ["титул","курс","курс","курс","домашка","понятия","понятия","понятия","понятия",
  "методы","методы","методы","методы","методы","методы","методы","ии","финал"];
function cur(){ const y = deck.scrollTop + deck.clientHeight * .45;
  let k = 0; secs.forEach((s, i) => { if (s.offsetTop <= y) k = i; }); return k; }
function paint(){
  const k = cur();
  document.getElementById("rnum").textContent = String(k + 1).padStart(2, "0");
  document.getElementById("rsect").textContent = SECT[k] || "";
  document.getElementById("prog").style.width =
    (deck.scrollTop / (deck.scrollHeight - deck.clientHeight) * 100) + "%";
}
function go(d){ const k = Math.max(0, Math.min(secs.length - 1, cur() + d));
  secs[k].scrollIntoView({behavior:"smooth", block:"start"}); }
deck.addEventListener("scroll", paint, {passive:true});
document.getElementById("dn").onclick = () => go(1);
document.getElementById("up").onclick = () => go(-1);
addEventListener("keydown", e => {
  if (["ArrowDown","PageDown"," "].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowUp","PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "Home") { e.preventDefault(); secs[0].scrollIntoView(); }
  else if (e.key === "End") { e.preventDefault(); secs[secs.length-1].scrollIntoView(); }
});
paint();
</script>
